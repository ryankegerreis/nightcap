# Versions and publishes Nightcap with release-please.
#
# On every push to master, release-please keeps a release PR open that bumps
# Cargo.toml and CHANGELOG.md from the Conventional Commit titles merged since
# the last release. Merging that PR tags the release and creates it as a draft;
# the jobs below then build each platform, upload the assets and publish it.
#
# Asset names carry no version so that
# https://github.com/ryankegerreis/nightcap/releases/latest/download/<asset>
# always points at the newest build. The marketing site links to those URLs.
# Drafts don't count as "latest", so those links keep serving the previous
# release until every asset is uploaded.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Two pushes in quick succession must not both try to create the release.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  macos:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: scripts/bundle-macos.sh --universal --dmg
      - run: mkdir dist && cp target/release/bundle/Nightcap.dmg dist/Nightcap-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/nightcap.exe pkg/Nightcap.exe
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE pkg/
          Compress-Archive -Path pkg/* -DestinationPath dist/Nightcap-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    # The oldest supported runner, so the binary works on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Install egui system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist pkg/nightcap
          cp target/release/nightcap README.md LICENSE-MIT LICENSE-APACHE pkg/nightcap/
          tar -C pkg -czf dist/Nightcap-Linux-x86_64.tar.gz nightcap
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [release-please, macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
