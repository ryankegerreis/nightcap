# Builds Nightcap for macOS, Windows and Linux and publishes a GitHub release.
# Runs when a tag like v0.1.0 is pushed. The tag must match Cargo.toml's version.
#
# Asset names carry no version so that
# https://github.com/ryankegerreis/nightcap/releases/latest/download/<asset>
# always points at the newest build. The marketing site links to those URLs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: scripts/bundle-macos.sh --universal --dmg
      - run: mkdir dist && cp target/release/bundle/Nightcap.dmg dist/Nightcap-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/nightcap.exe pkg/Nightcap.exe
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE pkg/
          Compress-Archive -Path pkg/* -DestinationPath dist/Nightcap-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: check-version
    # The oldest supported runner, so the binary works on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install egui system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist pkg/nightcap
          cp target/release/nightcap README.md LICENSE-MIT LICENSE-APACHE pkg/nightcap/
          tar -C pkg -czf dist/Nightcap-Linux-x86_64.tar.gz nightcap
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightcap ${GITHUB_REF_NAME#v}" \
            --generate-notes $prerelease
