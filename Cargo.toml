[package]
name = "nightcap"
version = "0.1.0"
edition = "2024"
description = "A sleep timer for your computer: dims the screen, lowers the volume, then puts it to sleep."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryankegerreis/nightcap"
readme = "README.md"
keywords = ["sleep-timer", "brightness", "volume", "egui", "desktop"]
categories = ["gui"]

[dependencies]
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
directories = "6.0.0"
log = "0.4.34"
env_logger = "0.11.11"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
core-foundation = "0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Rpc",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Shutdown",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_Ole",
] }
